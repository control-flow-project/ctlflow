{{ define "main" }}
  <article class="document">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    {{ if and (not .IsHome) .Pages }}
      <nav class="section-pages" aria-label="{{ .Title }} pages">
        <ul>
          {{ range .Pages.ByWeight }}
            <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
          {{ end }}
        </ul>
      </nav>
    {{ end }}
  </article>
{{ end }}
