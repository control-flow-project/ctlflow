apiVersion: apps/v1
kind: Deployment
metadata:
  name: edged
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edged
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edged
    spec:
      automountServiceAccountToken: false
      serviceAccountName: edged
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
      containers:
        - name: edged
          image: edged
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: edged-runtime
          env:
            - name: CTLFLOW_PUBLIC_URL
              value: http://0.0.0.0:8081
            - name: CTLFLOW_PROBE_URL
              value: http://0.0.0.0:8080
            - name: CTLFLOW_IDENTITY_TLS_CA_PATH
              value: /var/run/ctlflow/trust/identityd-ca.crt
            - name: CTLFLOW_WORKLOAD_TOKEN_FILE
              value: /var/run/secrets/ctlflow/token
          ports:
            - name: public
              containerPort: 8081
            - name: probe
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsUser: 65532
          volumeMounts:
            - name: trust
              mountPath: /var/run/ctlflow/trust
              readOnly: true
            - name: workload-token
              mountPath: /var/run/secrets/ctlflow
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: application
          image: edged-test-application
          imagePullPolicy: IfNotPresent
          ports:
            - name: application
              containerPort: 18080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      volumes:
        - name: trust
          configMap:
            name: edged-trust
        - name: workload-token
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  audience: ctlflow-edged
                  expirationSeconds: 600
                  path: token
        - name: tmp
          emptyDir: {}
