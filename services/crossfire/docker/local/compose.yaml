name: ctlflow-local

x-server-state: &server-state
  - server-state:/runtime

x-server-resources: &server-resources
  platform: linux/amd64
  pull_policy: never
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 2g
  pids_limit: 512
  cgroup_parent: ${CTLFLOW_CGROUP_PARENT:-}
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=256m,mode=1777

services:
  initialize:
    <<: *server-resources
    profiles: [maintenance]
    image: ${CROSSFIRE_MIGRATION_IMAGE:?Set the exact matching migration image}
    network_mode: none
    volumes: *server-state
    entrypoint: [node, /app/services/crossfire/crossfire]
    command: [init, --directory, /runtime, --instance, local, --origin, "http://127.0.0.1:8080", --content-origin, "http://localhost:8082", --server-name, local.test, --administrator, admin]

  migrate:
    <<: *server-resources
    profiles: [maintenance]
    image: ${CROSSFIRE_MIGRATION_IMAGE:?Set the exact matching migration image}
    network_mode: none
    volumes: *server-state

  crossfire:
    <<: *server-resources
    image: ${CROSSFIRE_RUNTIME_IMAGE:?Set the exact selected runtime image}
    volumes: *server-state
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8082:8082"
    stop_grace_period: 30s

volumes:
  server-state:
