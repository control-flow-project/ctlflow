apiVersion: apps/v1
kind: Deployment
metadata:
  name: authd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authd
    spec:
      automountServiceAccountToken: false
      serviceAccountName: authd
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
      containers:
        - name: authd
          image: authd
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: authd-runtime
          env:
            - name: CTLFLOW_PUBLIC_URL
              value: http://0.0.0.0:8081
            - name: CTLFLOW_PROBE_URL
              value: http://0.0.0.0:8080
            - name: CTLFLOW_PROVIDER_CONFIG_PATH
              value: /var/run/ctlflow/config/providers.json
            - name: CTLFLOW_PROVIDER_SECRET_PATH
              value: /var/run/ctlflow/secrets/provider-credentials.json
            - name: CTLFLOW_IDENTITY_TLS_CA_PATH
              value: /var/run/ctlflow/trust/identityd-ca.crt
            - name: CTLFLOW_TENANT_TLS_CA_PATH
              value: /var/run/ctlflow/trust/tenantd-ca.crt
            - name: CTLFLOW_WORKLOAD_TOKEN_FILE
              value: /var/run/secrets/ctlflow-workload/token
          ports:
            - name: public
              containerPort: 8081
            - name: probe
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsUser: 65532
          volumeMounts:
            - name: provider-config
              mountPath: /var/run/ctlflow/config
              readOnly: true
            - name: provider-secrets
              mountPath: /var/run/ctlflow/secrets
              readOnly: true
            - name: trust
              mountPath: /var/run/ctlflow/trust
              readOnly: true
            - name: workload-token
              mountPath: /var/run/secrets/ctlflow-workload
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: provider-config
          configMap:
            name: authd-provider-config
        - name: provider-secrets
          secret:
            secretName: authd-provider-secrets
            defaultMode: 288
        - name: trust
          configMap:
            name: authd-trust
        - name: workload-token
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  audience: ctlflow-internal
                  expirationSeconds: 600
                  path: token
        - name: tmp
          emptyDir: {}
