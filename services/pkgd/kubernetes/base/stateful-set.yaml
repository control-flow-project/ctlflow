apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pkgd
spec:
  replicas: 1
  serviceName: pkgd
  selector:
    matchLabels:
      app.kubernetes.io/name: pkgd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pkgd
    spec:
      automountServiceAccountToken: false
      serviceAccountName: pkgd
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
      containers:
        - name: pkgd
          image: pkgd
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pkgd-runtime
          env:
            - name: CTLFLOW_GRPC_URL
              value: https://0.0.0.0:50051
            - name: CTLFLOW_PROBE_URL
              value: http://0.0.0.0:8080
            - name: CTLFLOW_DATABASE_PROVIDER
              value: sqlite
            - name: CTLFLOW_DATABASE_PATH
              value: /var/lib/ctlflow/pkgd.sqlite
            - name: CTLFLOW_WORKLOAD_TOKEN_FILE
              value: /var/run/secrets/ctlflow/token
            - name: CTLFLOW_TLS_CERTIFICATE_PATH
              value: /var/run/ctlflow/tls/tls.crt
            - name: CTLFLOW_TLS_PRIVATE_KEY_PATH
              value: /var/run/ctlflow/tls/tls.key
            - name: CTLFLOW_KUBERNETES_CLIENT_CA_PATH
              value: /var/run/ctlflow/trust/kubernetes-client-ca.crt
            - name: CTLFLOW_WORKLOAD_JWKS_PATH
              value: /var/run/ctlflow/trust/workload-jwks.json
            - name: CTLFLOW_AUDIT_TLS_CA_PATH
              value: /var/run/ctlflow/trust/auditd-ca.crt
            - name: CTLFLOW_IDENTITY_TLS_CA_PATH
              value: /var/run/ctlflow/trust/identityd-ca.crt
          ports:
            - name: grpc
              containerPort: 50051
            - name: probe
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsUser: 65532
          volumeMounts:
            - name: data
              mountPath: /var/lib/ctlflow
            - name: tls
              mountPath: /var/run/ctlflow/tls
              readOnly: true
            - name: trust
              mountPath: /var/run/ctlflow/trust
              readOnly: true
            - name: workload-token
              mountPath: /var/run/secrets/ctlflow
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pkgd-data
        - name: tls
          secret:
            secretName: pkgd-tls
            defaultMode: 288
        - name: trust
          configMap:
            name: pkgd-trust
        - name: workload-token
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  audience: ctlflow-internal
                  expirationSeconds: 600
                  path: token
        - name: tmp
          emptyDir: {}
