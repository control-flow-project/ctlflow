syntax = "proto3";

package ctlflow.tenancy.v1;

option csharp_namespace = "CtlFlow.Tenancy.V1";

import "google/protobuf/timestamp.proto";

service TenantService {
  rpc CreateTenant(CreateTenantRequest) returns (Tenant);
  rpc GetTenant(GetTenantRequest) returns (Tenant);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc UpdateTenant(UpdateTenantRequest) returns (Tenant);
  rpc SetTenantState(SetTenantStateRequest) returns (Tenant);

  rpc CreateWorkspace(CreateWorkspaceRequest) returns (Workspace);
  rpc GetWorkspace(GetWorkspaceRequest) returns (Workspace);
  rpc ListWorkspaces(ListWorkspacesRequest)
      returns (ListWorkspacesResponse);
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (Workspace);
  rpc SetWorkspaceState(SetWorkspaceStateRequest) returns (Workspace);

  rpc ResolveTenant(ResolveTenantRequest)
      returns (ResolveTenantResponse);
  rpc ResolveWorkspace(ResolveWorkspaceRequest)
      returns (ResolveWorkspaceResponse);
}

message CreateTenantRequest {
  string tenant_id = 1;
  string address = 2;
  string display_name = 3;
}

message GetTenantRequest {
  string tenant_id = 1;
}

message ListTenantsRequest {
  uint32 page_size = 1;
  optional string after_tenant_id = 2;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  optional string next_after_tenant_id = 2;
}

message UpdateTenantRequest {
  string tenant_id = 1;
  uint64 expected_revision = 2;
  string display_name = 3;
}

message SetTenantStateRequest {
  string tenant_id = 1;
  uint64 expected_revision = 2;
  ResourceState state = 3;
}

message CreateWorkspaceRequest {
  string workspace_id = 1;
  string tenant_id = 2;
  string address = 3;
  string display_name = 4;
}

message GetWorkspaceRequest {
  string workspace_id = 1;
}

message ListWorkspacesRequest {
  string tenant_id = 1;
  uint32 page_size = 2;
  optional string after_workspace_id = 3;
}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
  optional string next_after_workspace_id = 2;
}

message UpdateWorkspaceRequest {
  string workspace_id = 1;
  uint64 expected_revision = 2;
  string display_name = 3;
}

message SetWorkspaceStateRequest {
  string workspace_id = 1;
  uint64 expected_revision = 2;
  ResourceState state = 3;
}

message ResolveTenantRequest {
  string address = 1;
}

message ResolveTenantResponse {
  string tenant_id = 1;
  ResourceState state = 2;
  uint64 revision = 3;
}

message ResolveWorkspaceRequest {
  string tenant_id = 1;
  string address = 2;
}

message ResolveWorkspaceResponse {
  string workspace_id = 1;
  ResourceState state = 2;
  uint64 revision = 3;
}

message Tenant {
  string tenant_id = 1;
  string address = 2;
  string display_name = 3;
  ResourceState state = 4;
  uint64 revision = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message Workspace {
  string workspace_id = 1;
  string tenant_id = 2;
  string address = 3;
  string display_name = 4;
  ResourceState state = 5;
  uint64 revision = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

enum ResourceState {
  RESOURCE_STATE_UNSPECIFIED = 0;
  RESOURCE_STATE_ACTIVE = 1;
  RESOURCE_STATE_SUSPENDED = 2;
  RESOURCE_STATE_DELETED = 3;
}
