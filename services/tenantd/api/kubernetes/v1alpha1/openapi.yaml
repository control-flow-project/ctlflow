openapi: 3.0.3
info:
  title: CtlFlow tenancy aggregated API
  version: v1alpha1
  description: >-
    Kubernetes-aggregated operator API. Forwarded operator identity is accepted only from an authenticated Kubernetes API server.
servers:
  - url: /apis/tenancy.ctlflow.com/v1alpha1
paths:
  /:
    $ref: "./paths.yaml#/~1"
  /tenants:
    $ref: "./paths.yaml#/~1tenants"
  /tenants/{tenantId}:
    $ref: "./paths.yaml#/~1tenants~1%7BtenantId%7D"
  /tenants/{tenantId}/suspend:
    $ref: "./paths.yaml#/~1tenants~1%7BtenantId%7D~1suspend"
  /tenants/{tenantId}/resume:
    $ref: "./paths.yaml#/~1tenants~1%7BtenantId%7D~1resume"
  /tenants/{tenantId}/retry:
    $ref: "./paths.yaml#/~1tenants~1%7BtenantId%7D~1retry"
  /workspaces:
    $ref: "./paths.yaml#/~1workspaces"
  /workspaces/{workspaceId}:
    $ref: "./paths.yaml#/~1workspaces~1%7BworkspaceId%7D"
  /workspaces/{workspaceId}/suspend:
    $ref: "./paths.yaml#/~1workspaces~1%7BworkspaceId%7D~1suspend"
  /workspaces/{workspaceId}/resume:
    $ref: "./paths.yaml#/~1workspaces~1%7BworkspaceId%7D~1resume"
  /workspaces/{workspaceId}/retry:
    $ref: "./paths.yaml#/~1workspaces~1%7BworkspaceId%7D~1retry"
components:
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueId"
    TenantSelector:
      name: fieldSelector
      in: query
      required: true
      description: Exact selector in the form spec.tenantId=ID
      schema:
        type: string
        maxLength: 96
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Continue:
      name: continue
      in: query
      schema:
        type: string
        maxLength: 128
      description: Opaque continuation for a list; invalid for a watch.
    Watch:
      name: watch
      in: query
      schema:
        type: boolean
        default: false
      description: Selects a newline-delimited Kubernetes watch stream.
    ResourceVersion:
      name: resourceVersion
      in: query
      schema:
        type: string
        pattern: "^(0|[1-9][0-9]{0,18})$"
      description: Required starting cursor when watch=true.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
  requestBodies:
    LifecycleAction:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LifecycleAction"
  responses:
    KubernetesFailure:
      description: Kubernetes Status failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
    TenantLifecycleAccepted:
      description: Tenant lifecycle operation accepted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Tenant"
    WorkspaceLifecycleAccepted:
      description: Workspace lifecycle operation accepted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Workspace"
  schemas:
    OpaqueId:
      type: string
      pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
    ObjectMeta:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/OpaqueId"
        resourceVersion:
          type: string
          pattern: "^[1-9][0-9]{0,18}$"
        creationTimestamp:
          type: string
          format: date-time
      required: []
    ListMeta:
      type: object
      additionalProperties: false
      properties:
        resourceVersion:
          type: string
          pattern: "^(0|[1-9][0-9]{0,18})$"
        continue:
          type: string
          maxLength: 128
      required:
        - resourceVersion
    ExternalTenantAddress:
      type: object
      additionalProperties: false
      required:
        - authority
        - pathPrefix
      properties:
        authority:
          type: string
          maxLength: 253
        pathPrefix:
          type: string
          maxLength: 72
    InitialAdministrator:
      type: object
      additionalProperties: false
      required:
        - displayName
        - loginIdentifier
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        loginIdentifier:
          type: string
          minLength: 1
          maxLength: 320
        identityLink:
          $ref: "#/components/schemas/IdentityLinkDeclaration"
    IdentityLinkDeclaration:
      type: object
      additionalProperties: false
      required:
        - providerId
        - providerSubject
      properties:
        providerId:
          $ref: "#/components/schemas/OpaqueId"
        providerSubject:
          type: string
          minLength: 1
          maxLength: 512
    BaselinePackage:
      type: object
      additionalProperties: false
      required:
        - packageId
        - packageVersion
      properties:
        packageId:
          $ref: "#/components/schemas/OpaqueId"
        packageVersion:
          type: string
          minLength: 1
          maxLength: 128
    InitialMembership:
      type: object
      additionalProperties: false
      required:
        - userId
        - standing
      properties:
        userId:
          $ref: "#/components/schemas/OpaqueId"
        standing:
          type: string
          enum:
            - admin
            - member
    TenantSpec:
      type: object
      additionalProperties: false
      required:
        - displayName
        - address
        - initialAdministrator
        - baselinePackages
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        address:
          $ref: "#/components/schemas/ExternalTenantAddress"
        initialAdministrator:
          $ref: "#/components/schemas/InitialAdministrator"
        baselinePackages:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: "#/components/schemas/BaselinePackage"
    WorkspaceSpec:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - displayName
        - workspaceAddress
        - initialMemberships
        - baselinePackages
      properties:
        tenantId:
          $ref: "#/components/schemas/OpaqueId"
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        workspaceAddress:
          type: string
          pattern: "^[a-z0-9][a-z0-9._~-]{0,62}$"
        initialMemberships:
          type: array
          maxItems: 256
          uniqueItems: true
          items:
            $ref: "#/components/schemas/InitialMembership"
        baselinePackages:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: "#/components/schemas/BaselinePackage"
    CurrentOperation:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        kind:
          type: string
          enum:
            - provision
            - suspend
            - resume
            - delete
    Condition:
      type: object
      additionalProperties: false
      required:
        - owner
        - state
        - lastTransitionTime
      properties:
        owner:
          type: string
          enum:
            - identity
            - configuration
            - execution
            - packages
        state:
          type: string
          enum:
            - pending
            - blocked
        ownerRevision:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 200
        lastTransitionTime:
          type: string
          format: date-time
    ResourceStatus:
      type: object
      additionalProperties: false
      required:
        - lifecycle
        - revision
        - provisioningGeneration
        - conditions
      properties:
        lifecycle:
          type: string
          enum:
            - provisioning
            - active
            - suspending
            - suspended
            - resuming
            - deleting
            - failed
            - deleted
        revision:
          type: integer
          format: int64
          minimum: 1
        provisioningGeneration:
          type: integer
          format: int64
          minimum: 1
        currentOperation:
          $ref: "#/components/schemas/CurrentOperation"
        conditions:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/Condition"
    Tenant:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - metadata
        - spec
      properties:
        apiVersion:
          type: string
          enum:
            - tenancy.ctlflow.com/v1alpha1
        kind:
          type: string
          enum:
            - Tenant
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/TenantSpec"
        status:
          $ref: "#/components/schemas/ResourceStatus"
    Workspace:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - metadata
        - spec
      properties:
        apiVersion:
          type: string
          enum:
            - tenancy.ctlflow.com/v1alpha1
        kind:
          type: string
          enum:
            - Workspace
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          $ref: "#/components/schemas/WorkspaceSpec"
        status:
          $ref: "#/components/schemas/ResourceStatus"
    TenantList:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - metadata
        - items
      properties:
        apiVersion:
          type: string
          enum:
            - tenancy.ctlflow.com/v1alpha1
        kind:
          type: string
          enum:
            - TenantList
        metadata:
          $ref: "#/components/schemas/ListMeta"
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Tenant"
    WorkspaceList:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - metadata
        - items
      properties:
        apiVersion:
          type: string
          enum:
            - tenancy.ctlflow.com/v1alpha1
        kind:
          type: string
          enum:
            - WorkspaceList
        metadata:
          $ref: "#/components/schemas/ListMeta"
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Workspace"
    TenantWatchEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - object
      properties:
        type:
          $ref: "#/components/schemas/WatchEventType"
        object:
          oneOf:
            - $ref: "#/components/schemas/Tenant"
            - $ref: "#/components/schemas/Status"
    WorkspaceWatchEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - object
      properties:
        type:
          $ref: "#/components/schemas/WatchEventType"
        object:
          oneOf:
            - $ref: "#/components/schemas/Workspace"
            - $ref: "#/components/schemas/Status"
    WatchEventType:
      type: string
      enum:
        - ADDED
        - MODIFIED
        - ERROR
    LifecycleAction:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - resourceVersion
      properties:
        apiVersion:
          type: string
          enum:
            - tenancy.ctlflow.com/v1alpha1
        kind:
          type: string
          enum:
            - LifecycleAction
        resourceVersion:
          type: string
          pattern: "^[1-9][0-9]{0,18}$"
    APIResourceList:
      type: object
      additionalProperties: true
      required:
        - apiVersion
        - groupVersion
        - kind
        - resources
      properties:
        apiVersion:
          type: string
        groupVersion:
          type: string
        kind:
          type: string
        resources:
          type: array
          items:
            type: object
    Status:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - status
        - message
        - reason
        - code
      properties:
        apiVersion:
          type: string
          enum:
            - v1
        kind:
          type: string
          enum:
            - Status
        status:
          type: string
          enum:
            - Failure
        message:
          type: string
          maxLength: 512
        reason:
          type: string
          enum:
            - Invalid
            - Unauthorized
            - NotFound
            - AlreadyExists
            - Conflict
            - Expired
            - ServiceUnavailable
            - Timeout
            - InternalError
        details:
          $ref: "#/components/schemas/StatusDetails"
        code:
          type: integer
          minimum: 400
          maximum: 599
    StatusDetails:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 64
        group:
          type: string
          enum:
            - tenancy.ctlflow.com
        kind:
          type: string
          enum:
            - tenants
            - workspaces
        causes:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/StatusCause"
    StatusCause:
      type: object
      additionalProperties: false
      required:
        - reason
        - message
        - field
      properties:
        reason:
          type: string
          enum:
            - FieldValueRequired
            - FieldValueInvalid
            - FieldValueDuplicate
            - FieldValueNotSupported
        message:
          type: string
          maxLength: 256
        field:
          type: string
          maxLength: 128
