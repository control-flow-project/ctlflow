/:
  get:
    operationId: discoverTenancy
    responses:
      "200":
        description: API resource discovery
        content:
          application/json:
            schema:
              $ref: "./openapi.yaml#/components/schemas/APIResourceList"
/tenants:
  get:
    operationId: listOrWatchTenants
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/Limit"
      - $ref: "./openapi.yaml#/components/parameters/Continue"
      - $ref: "./openapi.yaml#/components/parameters/Watch"
      - $ref: "./openapi.yaml#/components/parameters/ResourceVersion"
    responses:
      "200":
        description: Bounded Tenant list or watch stream
        content:
          application/json:
            schema:
              $ref: "./openapi.yaml#/components/schemas/TenantList"
          "application/json;stream=watch":
            schema:
              $ref: "./openapi.yaml#/components/schemas/TenantWatchEvent"
      default:
        $ref: "./openapi.yaml#/components/responses/KubernetesFailure"
  post:
    operationId: createTenant
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./openapi.yaml#/components/schemas/Tenant"
    responses:
      "201":
        description: Tenant accepted in provisioning state
        content:
          application/json:
            schema:
              $ref: "./openapi.yaml#/components/schemas/Tenant"
      default:
        $ref: "./openapi.yaml#/components/responses/KubernetesFailure"
/tenants/{tenantId}:
  parameters:
    - $ref: "./openapi.yaml#/components/parameters/TenantId"
  get:
    operationId: getTenant
    responses:
      "200":
        description: Exact retained Tenant
        content:
          application/json:
            schema:
              $ref: "./openapi.yaml#/components/schemas/Tenant"
      default:
        $ref: "./openapi.yaml#/components/responses/KubernetesFailure"
  put:
    operationId: updateTenant
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./openapi.yaml#/components/schemas/Tenant"
    responses:
      "200":
        description: Updated Tenant
        content:
          application/json:
            schema:
              $ref: "./openapi.yaml#/components/schemas/Tenant"
      default:
        $ref: "./openapi.yaml#/components/responses/KubernetesFailure"
  delete:
    operationId: deleteTenant
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./openapi.yaml#/components/schemas/LifecycleAction"
    responses:
      "202":
        description: Irreversible deletion accepted
        content:
          application/json:
            schema:
              $ref: "./openapi.yaml#/components/schemas/Tenant"
      default:
        $ref: "./openapi.yaml#/components/responses/KubernetesFailure"
/tenants/{tenantId}/suspend:
  parameters:
    - $ref: "./openapi.yaml#/components/parameters/TenantId"
  put:
    operationId: suspendTenant
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/IdempotencyKey"
    requestBody:
      $ref: "./openapi.yaml#/components/requestBodies/LifecycleAction"
    responses:
      "202":
        $ref: "./openapi.yaml#/components/responses/TenantLifecycleAccepted"
      default:
        $ref: "./openapi.yaml#/components/responses/KubernetesFailure"
/tenants/{tenantId}/resume:
  parameters:
    - $ref: "./openapi.yaml#/components/parameters/TenantId"
  put:
    operationId: resumeTenant
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/IdempotencyKey"
    requestBody:
      $ref: "./openapi.yaml#/components/requestBodies/LifecycleAction"
    responses:
      "202":
        $ref: "./openapi.yaml#/components/responses/TenantLifecycleAccepted"
      default:
        $ref: "./openapi.yaml#/components/responses/KubernetesFailure"
/tenants/{tenantId}/retry:
  parameters:
    - $ref: "./openapi.yaml#/components/parameters/TenantId"
  put:
    operationId: retryTenant
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/IdempotencyKey"
    requestBody:
      $ref: "./openapi.yaml#/components/requestBodies/LifecycleAction"
    responses:
      "202":
        $ref: "./openapi.yaml#/components/responses/TenantLifecycleAccepted"
      default:
        $ref: "./openapi.yaml#/components/responses/KubernetesFailure"
