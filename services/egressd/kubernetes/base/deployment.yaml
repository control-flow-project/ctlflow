apiVersion: apps/v1
kind: Deployment
metadata:
  name: egressd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: egressd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egressd
    spec:
      automountServiceAccountToken: false
      serviceAccountName: egressd
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
      containers:
        - name: egressd
          image: egressd
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: egressd-runtime
          env:
            - name: CTLFLOW_PRIVATE_URL
              value: http://0.0.0.0:8081
            - name: CTLFLOW_PROBE_URL
              value: http://0.0.0.0:8080
            - name: CTLFLOW_EGRESS_BINDING_PATH
              value: /var/run/ctlflow/config/binding.json
            - name: CTLFLOW_EGRESS_SECRETS_PATH
              value: /var/run/ctlflow/secrets/secrets.json
            - name: CTLFLOW_WORKLOAD_JWKS_PATH
              value: /var/run/ctlflow/trust/workload-jwks.json
            - name: CTLFLOW_UPSTREAM_TLS_CA_PATH
              value: /var/run/ctlflow/trust/upstream-ca.crt
          ports:
            - name: private
              containerPort: 8081
            - name: probe
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsUser: 65532
          volumeMounts:
            - name: configuration
              mountPath: /var/run/ctlflow/config
              readOnly: true
            - name: secrets
              mountPath: /var/run/ctlflow/secrets
              readOnly: true
            - name: trust
              mountPath: /var/run/ctlflow/trust
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: configuration
          configMap:
            name: egressd-provider-config
        - name: secrets
          secret:
            secretName: egressd-provider-secrets
        - name: trust
          configMap:
            name: egressd-trust
        - name: tmp
          emptyDir: {}
